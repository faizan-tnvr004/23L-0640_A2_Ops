services:
  db:
    image: postgres:16-alpine
    container_name: visionguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data     # named volume: data survives container removal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [visionguard_net]
    # NO "ports:" on purpose: the database is reachable only from other services on visionguard_net.

  web:
    build: .
    image: visionguard-web:latest
    container_name: visionguard-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy                 # web starts only after Postgres accepts connections
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /app/models/champion_model.keras
      DECISION_THRESHOLD: ${DECISION_THRESHOLD:-0.5}
      MAX_CONTENT_LENGTH_MB: ${MAX_CONTENT_LENGTH_MB:-5}
      SECRET_KEY: ${SECRET_KEY}
      API_KEY: ${API_KEY:-}
      MODEL_VERSION: ${MODEL_VERSION:-v2-champion-mobilenetv2}
      PROJECT_NAME: ${PROJECT_NAME:-23L-0640_A2_Ops}
      STUDENT_ROLL_NUMBER: ${STUDENT_ROLL_NUMBER:-23L-0640}
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - ./models:/app/models:ro                    # swap the champion via DVC without rebuilding the image
    networks: [visionguard_net]

networks:
  visionguard_net:
    driver: bridge

volumes:
  postgres_data:
